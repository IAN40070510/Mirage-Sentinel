server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    location ~ ^/(_api|_control|admin|app)(/|$) { return 404; }
    location / {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Storefront-Token "";
        proxy_set_header X-Edge-Token "${EDGE_TOKEN}";
        proxy_set_header X-Control-Token "";
        proxy_set_header X-Routing-Epoch "";
        proxy_set_header X-Visitor-Context "";
        proxy_set_header Connection "";
        proxy_read_timeout 70s;
    }
}
