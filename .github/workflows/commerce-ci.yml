name: Commerce validation

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    # Match OCI Ampere A1 instead of relying only on the developer's x86 machine.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r deploy/commerce/requirements.txt -r deploy/commerce/requirements-test.txt
      - name: Verify frozen five-class model
        run: |
          pip check
          python model/commerce-five/diversity-v2/runtime.py --self-test
      - name: Routing and isolation tests
        run: python -m pytest tests -q --junitxml=artifacts/commerce-tests.xml
      - name: Create ephemeral credentials
        run: python scripts/prepare_commerce.py
      - name: Build and initialize isolated stores
        run: python scripts/deploy_commerce.py --build --initialize
      - name: Confirm deployed gateway loaded the five-class model
        run: |
          python scripts/wait_commerce.py
          docker compose --env-file .env.commerce -f docker-compose.commerce.yml exec -T gateway python -c 'import os,json,urllib.request; req=urllib.request.Request("http://localhost:8000/_control/status",headers={"x-control-token":os.environ["CONTROL_TOKEN"]}); state=json.load(urllib.request.urlopen(req,timeout=10)); assert state["model"]=="ready_five_class", state["model"]; assert state["model_mode"]=="enforce", state["model_mode"]; print("Five-class gateway model loaded in enforce mode")'
      - name: Shopping and quarantine acceptance
        run: python scripts/wait_commerce.py && python scripts/smoke_commerce.py
      - name: Collect isolated normal shopping journeys
        run: python scripts/collect_commerce_normal.py --output artifacts/normal-shopping-capture --sessions 30 --revision "${{ github.sha }}"
      - name: Diagnose enforced model input coverage and concurrency
        run: python scripts/audit_enforced_model.py --capture artifacts/normal-shopping-capture --output artifacts/enforce-audit/ci.json
      - name: Check coverage and prepare normal candidates
        run: |
          python scripts/audit_normal_coverage.py --data artifacts/normal-shopping-capture --output artifacts/normal-shopping-capture/coverage.json --require-complete
          python scripts/prepare_normal_capture.py --capture artifacts/normal-shopping-capture --output artifacts/normal-shopping-candidates
          python scripts/audit_normal_coverage.py --data artifacts/normal-shopping-candidates/train --output artifacts/normal-shopping-candidates/training-coverage.json --require-complete
      - name: Save normal request capture for dataset repair
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-shopping-capture
          path: |
            artifacts/normal-shopping-capture/
            artifacts/normal-shopping-candidates/
            artifacts/enforce-audit/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commerce-tests
          path: artifacts/commerce-tests.xml
      - name: Stop this CI stack
        if: always()
        run: docker compose --env-file .env.commerce -f docker-compose.commerce.yml down -v
