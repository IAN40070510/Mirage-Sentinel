name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-commerce-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/commerce-ci.yml
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy the validated revision to OCI
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
          PUBLIC_URL: ${{ vars.COMMERCE_PUBLIC_URL || 'http://161.33.154.211' }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || '22' }}
          envs: DEPLOY_SHA,PUBLIC_URL
          command_timeout: 85m
          script: |
            set -eu
            cd ~/Mirage-Sentinel
            git fetch origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            case "$DEPLOY_SHA" in *[!a-f0-9]*|'') exit 1 ;; esac
            release="$HOME/Mirage-Sentinel-releases/$DEPLOY_SHA"
            mkdir -p "$HOME/Mirage-Sentinel-releases"
            if [ ! -d "$release" ]; then
              git worktree add --detach "$release" "$DEPLOY_SHA"
            fi
            sudo python3 "$release/scripts/deploy_oci_commerce.py" \
              --shared-env "$HOME/Mirage-Sentinel/.env.commerce" \
              --public-url "$PUBLIC_URL" --revision "$DEPLOY_SHA"
