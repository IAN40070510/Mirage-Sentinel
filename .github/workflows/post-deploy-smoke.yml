name: Post-Deploy Smoke Test

on:
  workflow_run:
    workflows: [Deploy to Oracle Cloud]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Read-only public storefront check
        env:
          PUBLIC_URL: ${{ vars.COMMERCE_PUBLIC_URL || 'http://161.33.154.211' }}
        run: |
          jar=$(mktemp)
          trap 'rm -f "$jar"' EXIT
          curl --fail --silent --show-error --location --max-time 60 --cookie-jar "$jar" --cookie "$jar" "$PUBLIC_URL/" > /dev/null
          curl --fail --silent --show-error --max-time 30 --cookie "$jar" "$PUBLIC_URL/store/regions" > /dev/null
