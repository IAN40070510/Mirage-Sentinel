name: Clean unused legacy images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clean only verified unused legacy images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || '22' }}
          command_timeout: 8m
          script: |
            set -eu
            sudo python3 - <<'PYREMOTE'
            import json, shutil, subprocess
            def output(*args):
                return subprocess.check_output(['docker', *args], text=True)
            def used_images():
                ids = output('ps', '-aq').split()
                return {row['Image'] for row in json.loads(output('inspect', *ids))} if ids else set()
            before = set(output('ps', '--format', '{{.Names}}').splitlines())
            print('Free before:', shutil.disk_usage('/var/lib/docker').free, flush=True)
            targets = [
                'mirage-sentinel-frontend_customer:latest',
                'mirage-sentinel-frontend_soc:latest',
                'mirage-sentinel-backend_public:latest',
                'mirage-sentinel-backend_soc:latest',
                'mirage-sentinel-sandbox:latest',
                'mirage-sentinel-vuln_bank:latest',
                'redis:7-alpine', 'nginx:1.27-alpine',
            ]
            for name in targets:
                result = subprocess.run(['docker', 'image', 'inspect', '--format', '{{.Id}}', name], capture_output=True, text=True)
                if result.returncode:
                    print('Absent:', name, flush=True)
                    continue
                if result.stdout.strip() in used_images():
                    print('Retain used image:', name, flush=True)
                    continue
                subprocess.run(['docker', 'image', 'rm', name], check=True)
            assert before <= set(output('ps', '--format', '{{.Names}}').splitlines())
            print('Free after:', shutil.disk_usage('/var/lib/docker').free, flush=True)
            print('PASS: running containers retained; no volumes or commerce images deleted', flush=True)
            PYREMOTE
            curl --fail --silent --show-error --location --max-time 30 http://127.0.0.1/dk > /dev/null
            curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ > /dev/null
