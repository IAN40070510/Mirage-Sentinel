name: Demo readiness diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Mirage LLM connection and service health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || '22' }}
          command_timeout: 8m
          script: |
            set -eu
            sudo docker exec -i mirage-commerce-mirage-1 python - <<'PYREMOTE'
            import os, socket, urllib.request
            from urllib.parse import urlsplit
            url=os.getenv('OLLAMA_URL','http://ollama:11434')
            host=urlsplit(url).hostname
            print('Ollama hostname:',host,flush=True)
            try:
                print('Resolved address:',socket.gethostbyname(host),flush=True)
                with urllib.request.urlopen(url+'/api/tags',timeout=10) as r:
                    print('Ollama tags HTTP:',r.status,flush=True)
            except Exception as exc:
                print('OLLAMA_CHECK_FAILED:',type(exc).__name__,str(exc),flush=True)
            PYREMOTE
            sudo docker ps --format '{{.Names}} {{.Status}}'
            df -h /var/lib/docker
