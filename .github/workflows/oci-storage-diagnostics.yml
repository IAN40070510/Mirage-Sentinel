name: OCI storage diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect deployment storage without modifying application data
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || '22' }}
          command_timeout: 8m
          script: |
            set -eu
            sudo docker image ls --no-trunc --format '{{json .}}'
            sudo docker ps -a --format '{{.Names}} {{.Image}}'
            df -h /var/lib/docker
