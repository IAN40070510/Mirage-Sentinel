name: Remove authorized legacy containers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove legacy containers and verify current commerce
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || '22' }}
          command_timeout: 8m
          script: |
            set -eu
            sudo python3 - <<'PYREMOTE'
            import subprocess
            import shutil
            print("Free bytes before:", shutil.disk_usage("/var/lib/docker").free, flush=True)
            targets = [
                'mirage_sentinel_frontend_customer', 'mirage_sentinel_frontend_soc',
                'mirage_sentinel_nginx', 'mirage_sentinel_backend_public',
                'mirage_sentinel_backend_soc', 'mirage_sentinel_vuln_bank',
                'mirage_sentinel_sandbox', 'mirage_sentinel_redis',
                'mirage_sentinel_vuln_bank_db', 'mirage_sentinel_postgres',
                'mirage_sentinel_ollama',
            ]
            def running():
                return set(subprocess.check_output(['docker','ps','--format','{{.Names}}'], text=True).splitlines())
            before = running()
            protected = {name for name in before if name.startswith('mirage-commerce-') or name == 'ollama'}
            all_names = set(subprocess.check_output(['docker','ps','-a','--format','{{.Names}}'], text=True).splitlines())
            for name in targets:
                if name not in all_names:
                    print('Absent:', name, flush=True)
                    continue
                if name in running():
                    raise RuntimeError('Refusing to remove a running container: ' + name)
                subprocess.run(['docker','rm',name], check=True)
            after = running()
            assert not after.intersection(targets), 'Some legacy services remain running'
            assert protected <= after, 'A protected service is no longer running'
            remaining = set(subprocess.check_output(['docker','ps','-a','--format','{{.Names}}'], text=True).splitlines())
            assert not remaining.intersection(targets), 'Some legacy containers remain'
            print('PASS: legacy containers removed; protected containers running; images and volumes retained', flush=True)
            print('Free bytes after:', shutil.disk_usage('/var/lib/docker').free, flush=True)
            PYREMOTE
            curl --fail --silent --show-error --location --max-time 30 http://127.0.0.1/dk > /dev/null
            curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ > /dev/null
