<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSDSS戰情室</title>
<style>body{margin:0;background:#0d1520;color:#e2eaf4;font:15px system-ui}main{max-width:1400px;margin:32px auto;padding:24px}h1{font-size:26px}p{color:#9dadc1}button,input,select{padding:10px;border:1px solid #42556b;border-radius:6px;background:#192b40;color:inherit;margin:4px}table{width:100%;border-collapse:collapse;margin-top:24px}th,td{padding:12px;text-align:left;border-bottom:1px solid #293c52}tr:hover{background:#192b40;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:#152437;border-radius:8px}.bad{color:#ffb49b}#status{color:#93d9d0}.event-detail:hover{background:transparent;cursor:default}.event-detail pre{margin:0}.event-toggle{margin:0;text-align:left;cursor:pointer}.event-toggle:focus-visible{outline:2px solid #93d9d0}</style>
<main><h1>MSDSS戰情室</h1><p>正常與沙盒互動時間線。點選事件查看請求、特徵、分數和實際回應。</p>
<div id="status">載入中</div><input id="visitor" placeholder="來源 IP（篩選已載入事件）" size="38"><select id="mode"><option value="all">全部流量</option><option value="real">正常環境</option><option value="sandbox">沙盒環境</option></select><button id="load">重新載入</button><button id="more">載入更早事件</button><button id="clear">顯示所有 IP</button><label><input id="live" type="checkbox" checked>每 3 秒更新</label><div id="updated"></div><button id="release">解除此訪客與關聯帳號的沙盒標記（免登入）</button><button id="export">匯出已載入 JSON</button><div id="action-result" role="status"></div>
<table><thead><tr><th>時間／序號</th><th>來源 IP</th><th>請求</th><th>環境</th><th>分數／來源</th><th>HTTP</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
let events=[],selectedVisitor='',selectedCursor=null,filter='',generation=0,loading=false;
const el=id=>document.getElementById(id);
const taiwanTime=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',fractionalSecondDigits:3,hour12:false});
function formatTaiwanTime(value){const date=new Date(value);return Number.isNaN(date.getTime())?value:taiwanTime.format(date)+' GMT+8';}
async function load(reset=false,older=false){
 if(loading&&!reset)return;
 if(reset){generation++;events=[];filter=el('visitor').value.trim();selectedVisitor='';selectedCursor=null;el('action-result').textContent=''}
 const version=generation;loading=true;
 try{
  const params=new URLSearchParams({latest:'true',limit:'200'});
  if(older&&events.length)params.set('before',String(Math.min(...events.map(e=>e.cursor))));
  else if(!reset&&events.length){params.set('latest','false');params.set('after',String(Math.max(...events.map(e=>e.cursor))))}
  const r=await fetch('/api/events?'+params,{cache:'no-store'});
  if(!r.ok)throw Error('讀取事件失敗 HTTP '+r.status);
  const page=await r.json();if(version!==generation)return;
  const merged=new Map(events.map(e=>[e.cursor,e]));for(const e of page)merged.set(e.cursor,e);
  events=[...merged.values()].sort((a,b)=>b.cursor-a.cursor).slice(0,2000);render();
  el('updated').textContent=`更新時間：${formatTaiwanTime(new Date().toISOString())}｜已載入 ${events.length} 筆（最多 2,000 筆）｜${filter?'篩選來源 IP：'+filter:'所有 IP'}${older&&!page.length?'｜沒有更早事件':''}`;
  const s=await fetch('/api/status',{cache:'no-store'});if(version!==generation)return;
  if(s.ok){const x=await s.json();el('status').textContent=`模型：${x.model}｜待寫入：${x.audit_queued}｜已送達：${x.audit_delivered}｜遺失：${x.audit_dropped}`}else el('status').textContent='無法讀取 Gateway 狀態';
 }catch(e){if(version===generation)el('updated').textContent='更新失敗，保留既有事件：'+String(e)}
 finally{if(version===generation)loading=false}
}
function render(){
 const rows=el('rows');rows.replaceChildren();
 const visible=events.filter(e=>(!filter||e.client_ip===filter)&&(el('mode').value==='all'||e.route===el('mode').value));
 if(!visible.some(e=>e.cursor===selectedCursor)){selectedCursor=null;selectedVisitor=''}
 for(const e of visible){
  const tr=document.createElement('tr');
  const expanded=e.cursor===selectedCursor;
  const score=e.model_probability==null?'模型無分數':'模型 '+(e.model_probability*100).toFixed(4)+'%';
  const toggle=document.createElement('button');toggle.type='button';toggle.className='event-toggle';
  toggle.textContent=(expanded?'▾ 收起 ':'▸ 詳細 ')+formatTaiwanTime(e.at)+' / '+(e.sequence??'—');
  toggle.setAttribute('aria-expanded',String(expanded));toggle.setAttribute('aria-controls','event-detail-'+e.cursor);
  const time=document.createElement('td');time.append(toggle);tr.append(time);
  for(const t of [e.client_ip??'未記錄',e.method?e.method+' '+e.path:e.kind,e.route??'管理',score+' / '+(e.decision_source??'—'),e.status??'—']){
   const td=document.createElement('td');td.textContent=t;tr.append(td)
  }
  if(e.route==='sandbox')tr.className='bad';
  tr.onclick=()=>{selectedCursor=expanded?null:e.cursor;selectedVisitor=expanded?'':e.visitor_id;render()};
  rows.append(tr);
  if(expanded){
   const detailRow=document.createElement('tr');detailRow.className='event-detail';
   const cell=document.createElement('td');cell.colSpan=6;
   const detail=document.createElement('pre');detail.id='event-detail-'+e.cursor;detail.textContent=JSON.stringify(e,null,2);
   cell.append(detail);detailRow.append(cell);rows.append(detailRow)
  }
 }
}
el('load').onclick=()=>load(true);el('more').onclick=()=>load(false,true);el('mode').onchange=render;
el('visitor').onchange=()=>load(true);el('clear').onclick=()=>{el('visitor').value='';load(true)};
el('release').onclick=async()=>{const id=selectedVisitor;if(!/^[a-f0-9]{32}$/.test(id)){alert('請先選擇訪客');return}if(!confirm('解除訪客 '+id+' 與關聯帳號的沙盒標記？同帳號的其他訪客也會解除。下一次可疑請求仍會重新觸發。'))return;const r=await fetch('/api/release/'+id,{method:'POST',headers:{'x-soc-action':'release'}});el('action-result').textContent=await r.text();load()};
setInterval(()=>{if(el('live').checked&&!document.hidden)load()},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&el('live').checked)load()});
el('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(events,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='traffic-events.json';a.click();URL.revokeObjectURL(url)};load(true);
</script></html>
