<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirage Sentinel · 電商戰情室</title>
<style>body{margin:0;background:#0d1520;color:#e2eaf4;font:15px system-ui}main{max-width:1400px;margin:32px auto;padding:24px}h1{font-size:26px}p{color:#9dadc1}button,input,select{padding:10px;border:1px solid #42556b;border-radius:6px;background:#192b40;color:inherit;margin:4px}table{width:100%;border-collapse:collapse;margin-top:24px}th,td{padding:12px;text-align:left;border-bottom:1px solid #293c52}tr:hover{background:#192b40;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:#152437;border-radius:8px}.bad{color:#ffb49b}#status{color:#93d9d0}</style>
<main><h1>Mirage Sentinel · 電商戰情室</h1><p>正常與沙盒互動時間線。點選事件查看請求、特徵、分數和實際回應。</p>
<div id="status">載入中</div><input id="visitor" placeholder="訪客 ID（留空顯示全部）" size="38"><select id="mode"><option value="all">全部流量</option><option value="real">正常環境</option><option value="sandbox">沙盒環境</option></select><button id="load">重新載入</button><button id="more">載入後續事件</button><button id="release">解除此訪客的沙盒標記</button><button id="export">匯出已載入 JSON</button>
<table><thead><tr><th>時間／序號</th><th>訪客</th><th>請求</th><th>環境</th><th>分數／來源</th><th>HTTP</th></tr></thead><tbody id="rows"></tbody></table><pre id="detail">選取事件查看內容</pre></main>
<script>
let events=[],cursor=0;
const el=id=>document.getElementById(id);
async function load(reset=false){try{if(reset){events=[];cursor=0}const r=await fetch('/api/events?after='+cursor+'&visitor='+encodeURIComponent(el('visitor').value));if(!r.ok)throw Error('讀取失敗');const page=await r.json();events.push(...page);if(page.length)cursor=page.at(-1).cursor;render();const s=await fetch('/api/status');if(s.ok){const x=await s.json();el('status').textContent=`模型：${x.model}｜待寫入：${x.audit_queued}｜已送達：${x.audit_delivered}｜遺失：${x.audit_dropped}`}else el('status').textContent='無法讀取 Gateway 狀態'}catch(e){el('status').textContent=String(e)}}
function render(){el('rows').replaceChildren();for(const e of [...events].sort((a,b)=>a.at.localeCompare(b.at)||(a.sequence??0)-(b.sequence??0))){if(el('mode').value!=='all'&&e.route!==el('mode').value)continue;const tr=document.createElement('tr');const score=e.model_probability==null?'規則 '+(e.rule_score??'—'): '模型 '+e.model_probability;for(const t of [e.at+' / '+(e.sequence??'—'),e.visitor_id,e.method?e.method+' '+e.path:e.kind,e.route??'管理',score+' / '+(e.decision_source??'—'),e.status??'—']){const td=document.createElement('td');td.textContent=t;tr.append(td)}if(e.route==='sandbox')tr.className='bad';tr.onclick=()=>{el('detail').textContent=JSON.stringify(e,null,2);el('visitor').value=e.visitor_id};el('rows').append(tr)}}
el('load').onclick=()=>load(true);el('more').onclick=()=>load();el('mode').onchange=render;
el('release').onclick=async()=>{const id=el('visitor').value;if(!/^[a-f0-9]{32}$/.test(id)){alert('請先選擇訪客');return}if(!confirm('解除此訪客的沙盒標記？下一次可疑請求仍會重新觸發。'))return;const r=await fetch('/api/release/'+id,{method:'POST',headers:{'x-soc-action':'release'}});el('detail').textContent=await r.text();load()};
el('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(events,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='traffic-events.json';a.click();URL.revokeObjectURL(url)};load();
</script></html>
