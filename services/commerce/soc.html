<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirage Sentinel · 電商戰情室</title>
<style>body{margin:0;background:#0d1520;color:#e2eaf4;font:15px system-ui}main{max-width:1400px;margin:32px auto;padding:24px}h1{font-size:26px}p{color:#9dadc1}button,input,select{padding:10px;border:1px solid #42556b;border-radius:6px;background:#192b40;color:inherit;margin:4px}table{width:100%;border-collapse:collapse;margin-top:24px}th,td{padding:12px;text-align:left;border-bottom:1px solid #293c52}tr:hover{background:#192b40;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:#152437;border-radius:8px}.bad{color:#ffb49b}#status{color:#93d9d0}</style>
<main><h1>Mirage Sentinel · 電商戰情室</h1><p>正常與沙盒互動時間線。點選事件查看請求、特徵、分數和實際回應。</p>
<div id="status">載入中</div><input id="visitor" placeholder="來源 IP（篩選已載入事件）" size="38"><select id="mode"><option value="all">全部流量</option><option value="real">正常環境</option><option value="sandbox">沙盒環境</option></select><button id="load">重新載入</button><button id="more">載入更早事件</button><button id="clear">顯示所有 IP</button><label><input id="live" type="checkbox" checked>每 3 秒更新</label><div id="updated"></div><button id="release">解除此訪客的沙盒標記（需管理員驗證）</button><button id="export">匯出已載入 JSON</button>
<table><thead><tr><th>時間／序號</th><th>來源 IP</th><th>請求</th><th>環境</th><th>分數／來源</th><th>HTTP</th></tr></thead><tbody id="rows"></tbody></table><pre id="detail">選取事件查看內容</pre></main>
<script>
let events=[],selectedVisitor='',filter='',generation=0,loading=false;
const el=id=>document.getElementById(id);
const taiwanTime=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',fractionalSecondDigits:3,hour12:false});
function formatTaiwanTime(value){const date=new Date(value);return Number.isNaN(date.getTime())?value:taiwanTime.format(date)+' GMT+8';}
async function load(reset=false,older=false){
 if(loading&&!reset)return;
 if(reset){generation++;events=[];filter=el('visitor').value.trim();selectedVisitor='';el('detail').textContent='選取事件查看內容'}
 const version=generation;loading=true;
 try{
  const params=new URLSearchParams({latest:'true',limit:'200'});
  if(older&&events.length)params.set('before',String(Math.min(...events.map(e=>e.cursor))));
  else if(!reset&&events.length){params.set('latest','false');params.set('after',String(Math.max(...events.map(e=>e.cursor))))}
  const r=await fetch('/api/events?'+params,{cache:'no-store'});
  if(!r.ok)throw Error('讀取事件失敗 HTTP '+r.status);
  const page=await r.json();if(version!==generation)return;
  const merged=new Map(events.map(e=>[e.cursor,e]));for(const e of page)merged.set(e.cursor,e);
  events=[...merged.values()].sort((a,b)=>b.cursor-a.cursor).slice(0,2000);render();
  el('updated').textContent=`更新時間：${formatTaiwanTime(new Date().toISOString())}｜已載入 ${events.length} 筆（最多 2,000 筆）｜${filter?'篩選來源 IP：'+filter:'所有 IP'}${older&&!page.length?'｜沒有更早事件':''}`;
  const s=await fetch('/api/status',{cache:'no-store'});if(version!==generation)return;
  if(s.ok){const x=await s.json();el('status').textContent=`模型：${x.model}｜待寫入：${x.audit_queued}｜已送達：${x.audit_delivered}｜遺失：${x.audit_dropped}`}else el('status').textContent='無法讀取 Gateway 狀態';
 }catch(e){if(version===generation)el('updated').textContent='更新失敗，保留既有事件：'+String(e)}
 finally{if(version===generation)loading=false}
}
function render(){el('rows').replaceChildren();for(const e of events){if(filter&&e.client_ip!==filter)continue;if(el('mode').value!=='all'&&e.route!==el('mode').value)continue;const tr=document.createElement('tr');const score=e.model_probability==null?'模型無分數':'模型 '+(e.model_probability*100).toFixed(4)+'%';for(const t of [formatTaiwanTime(e.at)+' / '+(e.sequence??'—'),e.client_ip??'未記錄',e.method?e.method+' '+e.path:e.kind,e.route??'管理',score+' / '+(e.decision_source??'—'),e.status??'—']){const td=document.createElement('td');td.textContent=t;tr.append(td)}if(e.route==='sandbox')tr.className='bad';tr.onclick=()=>{el('detail').textContent=JSON.stringify(e,null,2);selectedVisitor=e.visitor_id};el('rows').append(tr)}}
el('load').onclick=()=>load(true);el('more').onclick=()=>load(false,true);el('mode').onchange=render;
el('visitor').onchange=()=>load(true);el('clear').onclick=()=>{el('visitor').value='';load(true)};
el('release').onclick=async()=>{const id=selectedVisitor;if(!/^[a-f0-9]{32}$/.test(id)){alert('請先選擇訪客');return}if(!confirm('解除訪客 '+id+' 的沙盒標記？下一次可疑請求仍會重新觸發。'))return;const r=await fetch('/api/release/'+id,{method:'POST',headers:{'x-soc-action':'release'}});el('detail').textContent=await r.text();load()};
setInterval(()=>{if(el('live').checked&&!document.hidden)load()},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&el('live').checked)load()});
el('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(events,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='traffic-events.json';a.click();URL.revokeObjectURL(url)};load(true);
</script></html>
